run_script:
  name: Decode device status
  description: >-
    Query a Tasmota device and decode its status report. The result is
    published on sensor.tasmota_script_output.
  fields:
    ip_address:
      name: IP address
      description: >-
        IP address of the Tasmota device. Must be a bare address, not a
        hostname and not a template that can render as "unavailable".
      required: true
      example: "192.168.1.48"
      selector:
        text:
